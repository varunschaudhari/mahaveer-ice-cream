---
# cPanel Git deploy (DEPLOYMENT.md §3-§4). $APPDIR / $WEBDIR come from ~/mahavir_deploy.env.
# Plain find / rm / cp only: rsync is not installed in every host's sandbox (CloudLinux CageFS).
# Each app folder is emptied first (removed pages disappear), keeping what each server owns:
# app/config.php and cPanel's files in order/. public_html also holds cPanel and Google files,
# so the website copy only adds and updates. Never deployed: tests/, docs/, tools/.
# The settings file is read line by line with spaces and Windows line ends removed (an editor on
# Windows easily adds an invisible \r, which would otherwise become part of the folder name).
# The deploy stops unless both folders already exist, so a typo never deletes or copies anything.
deployment:
  tasks:
    - export APPDIR="$(/bin/sed -n 's/^APPDIR=//p' $HOME/mahavir_deploy.env | /usr/bin/tr -d '[:space:]')"
    - export WEBDIR="$(/bin/sed -n 's/^WEBDIR=//p' $HOME/mahavir_deploy.env | /usr/bin/tr -d '[:space:]')"
    - /usr/bin/test -d "$APPDIR" -a -d "$WEBDIR" || { echo "mahavir_deploy.env - APPDIR or WEBDIR folder missing" >&2; exit 1; }
    - mkdir -p "$APPDIR/storage/uploads" "$APPDIR/storage/logs" "$APPDIR/storage/backups" "$APPDIR/storage/sessions" "$APPDIR/storage/cron"
    - mkdir -p "$APPDIR/app" "$APPDIR/lang" "$APPDIR/vendor" "$APPDIR/cron" "$APPDIR/database" "$APPDIR/order"
    - find "$APPDIR/app" -mindepth 1 -maxdepth 1 ! -name config.php -exec rm -rf {} +
    - find app -mindepth 1 -maxdepth 1 ! -name config.php -exec cp -R {} "$APPDIR/app/" \;
    - find "$APPDIR/lang" "$APPDIR/vendor" "$APPDIR/cron" "$APPDIR/database" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
    - cp -R lang/. "$APPDIR/lang/"
    - cp -R vendor/. "$APPDIR/vendor/"
    - cp -R cron/. "$APPDIR/cron/"
    - cp -R database/. "$APPDIR/database/"
    - find "$APPDIR/order" -mindepth 1 -maxdepth 1 ! -name .well-known ! -name .htaccess ! -name cgi-bin ! -name .user.ini ! -name php.ini ! -name error_log -exec rm -rf {} +
    - cp -R order/. "$APPDIR/order/"
    - cp -R website/. "$WEBDIR/"
    - echo "<?php return '$APPDIR';" > "$WEBDIR/approot.php"
